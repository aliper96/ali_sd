dataset_params:
  im_path : '../data/Train_FLOps/images'
#  im_path: '../data/Train_FLOps/Classification'
  mask_path : '../data/Train_FLOps/mascaras'
  caption_path : '../data/Train_FLOps/captions'
  im_channels : 1
  im_size : 256
  name: 'assembly'

diffusion_params:
  num_timesteps : 1000
  beta_start: 0.00085
  beta_end: 0.012

ldm_params:
  down_channels: [ 256, 384, 512, 768 ]
  mid_channels: [ 768, 512 ]
  down_sample: [ True, True, True ]
  attn_down : [True, True, True]
  time_emb_dim: 512
  norm_channels: 32
  num_heads: 16
  conv_out_channels : 128
  num_down_layers: 2
  num_mid_layers: 2
  num_up_layers: 2
  condition_config:
    condition_types: [ 'image' , 'text' ]
    text_condition_config:
      text_embed_model: 'clip'
      train_text_embed_model: False
      text_embed_dim: 512
      cond_drop_prob: 0.1
    image_condition_config:
      image_condition_input_channels: 1
      image_condition_output_channels: 3
      image_condition_h: 512
      image_condition_w: 512
      cond_drop_prob: 0.1

autoencoder_params:
  z_channels: 3
  codebook_size : 100
  down_channels : [64, 128, 256, 256]
  mid_channels : [256, 256]
  down_sample : [True, True, True]
  attn_down : [False, False,False]
  norm_channels: 32
  num_heads: 4
  num_down_layers : 2
  num_mid_layers : 2
  num_up_layers : 2


train_params:
  seed : 1111
  task_name: 'assembly'
  ldm_batch_size: 2
  autoencoder_batch_size: 12
  disc_start: 1000
  disc_weight: 0.5
  codebook_weight: 1
  commitment_beta: 0.2
  perceptual_weight: 1
  kl_weight: 0.000005
  ldm_epochs: 1000
  autoencoder_epochs: 1000
  num_samples: 5
  num_grid_rows: 1
  ldm_lr: 0.0005
  discriminator_lr: 0.001
  autoencoder_lr: 0.0001
  autoencoder_acc_steps: 4
  autoencoder_img_save_steps: 8
  save_latents : False
  cf_guidance_scale: 1.0
  vae_latent_dir_name: 'vae_latents'
  vqvae_latent_dir_name: 'vqvae_latents'
  ldm_ckpt_name: 'ddpm_ckpt_text_image_cond_clip.pth'
  vqvae_autoencoder_ckpt_name: 'vqvae_autoencoder_ckpt.pth'
  vae_autoencoder_ckpt_name: 'vae_autoencoder_ckpt.pth'
  vqvae_discriminator_ckpt_name: 'vqvae_discriminator_ckpt.pth'
  vae_discriminator_ckpt_name: 'vae_discriminator_ckpt.pth'
